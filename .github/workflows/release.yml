# Release: publish to npm (root + workspace packages) and PyPI, then create GitHub Release.
# Trigger: push a tag v* (e.g. v1.0.8). Run `npm run version` and commit before tagging.
# Root package @aporthq/aport-agent-guardrails exposes bin/agent-guardrails (CLI). Published workspace
# packages include core, langchain, crewai, cursor, claude-code, @aporthq/openclaw-aport, and the
# deprecated compatibility alias. n8n is not published yet (coming soon).
# PyPI: add this repo and workflow name "Release" in PyPI trusted publishing, or set PYPI_TOKEN secret.
name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release or recover (for example 1.0.21)"
        required: true
        type: string

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-node@v4
        with:
          registry-url: "https://registry.npmjs.org"
          node-version: "22"

      - name: Resolve version
        id: version
        run: |
          if [[ "${GITHUB_REF:-}" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF#refs/tags/v}"
          else
            VERSION="${{ github.event.inputs.version }}"
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Install dependencies
        run: npm ci

      - name: Verify npm dependency signatures
        run: npm audit signatures

      - name: Verify version matches release version
        run: |
          TAG_VERSION="${{ steps.version.outputs.VERSION }}"
          ROOT_VERSION=$(node -p "require('./package.json').version")
          if [ "$TAG_VERSION" != "$ROOT_VERSION" ]; then
            echo "Version mismatch: requested release is v$TAG_VERSION but root package.json has $ROOT_VERSION. Run 'npm run version' and commit before releasing."
            exit 1
          fi
          echo "Version OK: $TAG_VERSION"

      - name: Build workspace packages
        run: npm run build

      - name: Run release regression gate
        run: |
          APORT_SKIP_REMOTE_PASSPORT_TEST="${APORT_SKIP_REMOTE_PASSPORT_TEST:-1}" make test
          git diff --check

  publish-npm:
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-node@v4
        with:
          registry-url: "https://registry.npmjs.org"
          node-version: "22"

      - name: Resolve version
        id: version
        run: |
          if [[ "${GITHUB_REF:-}" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF#refs/tags/v}"
          else
            VERSION="${{ github.event.inputs.version }}"
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Install dependencies
        run: npm ci

      - name: Verify npm dependency signatures
        run: npm audit signatures

      - name: Verify version matches release version
        run: |
          TAG_VERSION="${{ steps.version.outputs.VERSION }}"
          ROOT_VERSION=$(node -p "require('./package.json').version")
          if [ "$TAG_VERSION" != "$ROOT_VERSION" ]; then
            echo "Version mismatch: requested release is v$TAG_VERSION but root package.json has $ROOT_VERSION. Run 'npm run version' and commit before releasing."
            exit 1
          fi
          echo "Version OK: $TAG_VERSION"

      - name: Fix package.json for npm
        run: npm pkg fix

      - name: Build workspace packages
        run: npm run build

      - name: Publish npm packages (skip if version already exists)
        run: |
          set -euo pipefail
          VERSION="${{ steps.version.outputs.VERSION }}"

          publish_if_needed() {
            local package_name="$1"
            shift || true
            if npm view "${package_name}@${VERSION}" version --registry https://registry.npmjs.org/ >/dev/null 2>&1; then
              echo "Skipping ${package_name}@${VERSION}: already published"
              return 0
            fi

            echo "Publishing ${package_name}@${VERSION}"
            npm publish "$@" --access public
          }

          publish_if_needed "@aporthq/aport-agent-guardrails"
          publish_if_needed "@aporthq/aport-agent-guardrails-core" -w @aporthq/aport-agent-guardrails-core
          publish_if_needed "@aporthq/aport-agent-guardrails-langchain" -w @aporthq/aport-agent-guardrails-langchain
          publish_if_needed "@aporthq/aport-agent-guardrails-crewai" -w @aporthq/aport-agent-guardrails-crewai
          publish_if_needed "@aporthq/aport-agent-guardrails-cursor" -w @aporthq/aport-agent-guardrails-cursor
          publish_if_needed "@aporthq/aport-agent-guardrails-claude-code" -w @aporthq/aport-agent-guardrails-claude-code
          publish_if_needed "@aporthq/openclaw-aport" -w @aporthq/openclaw-aport
          publish_if_needed "@aporthq/agent-guardrails" -w @aporthq/agent-guardrails
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      # npm registry CDN can briefly lag behind a successful publish; retry before failing CI.
      - name: Verify npm publication
        run: |
          set -uo pipefail
          VERSION="${{ steps.version.outputs.VERSION }}"
          PACKAGES=(
            "@aporthq/aport-agent-guardrails"
            "@aporthq/aport-agent-guardrails-core"
            "@aporthq/aport-agent-guardrails-langchain"
            "@aporthq/aport-agent-guardrails-crewai"
            "@aporthq/aport-agent-guardrails-cursor"
            "@aporthq/aport-agent-guardrails-claude-code"
            "@aporthq/openclaw-aport"
            "@aporthq/agent-guardrails"
          )
          MAX_ATTEMPTS="4"
          SLEEP_SECONDS="25"

          verify_all() {
            local failed=0
            for pkg in "${PACKAGES[@]}"; do
              echo "  Checking ${pkg}@${VERSION}"
              if ! npm view "${pkg}@${VERSION}" version --registry https://registry.npmjs.org/ >/dev/null 2>&1; then
                failed=1
              fi
            done
            return "$failed"
          }

          for attempt in $(seq 1 "${MAX_ATTEMPTS}"); do
            echo "npm verify (${attempt}/${MAX_ATTEMPTS})..."
            set +e
            verify_all
            rc=$?
            set -e
            if [[ "$rc" -eq 0 ]]; then
              echo "npm publication OK"
              exit 0
            fi
            if [[ "$attempt" -lt "${MAX_ATTEMPTS}" ]]; then
              echo "registry not consistent yet; waiting ${SLEEP_SECONDS}s..."
              sleep "${SLEEP_SECONDS}"
            fi
          done
          echo "::error::npm verification failed after ${MAX_ATTEMPTS} attempts (${SLEEP_SECONDS}s between retries)"
          exit 1
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  publish-python:
    needs: validate
    runs-on: ubuntu-latest
    env:
      TWINE_USERNAME: __token__
      TWINE_PASSWORD: ${{ secrets.PYPI_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Set version from tag
        id: version
        run: |
          if [[ "${GITHUB_REF:-}" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF#refs/tags/v}"
          else
            VERSION="${{ github.event.inputs.version }}"
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.10"

      - name: Install build tools
        run: |
          python -m pip install --upgrade pip
          pip install --disable-pip-version-check --no-input build twine
          python -m pip check

      - name: Build Python packages (core + adapters)
        run: |
          python -m build python/aport_guardrails
          python -m build python/langchain_adapter
          python -m build python/crewai_adapter

      - name: Verify build artifacts
        run: |
          for dir in python/aport_guardrails python/langchain_adapter python/crewai_adapter; do
            if [ ! -d "$dir/dist" ]; then echo "Build failed: $dir/dist not found"; exit 1; fi
            if ! ls $dir/dist/*.whl 1>/dev/null 2>&1; then echo "Build failed: no wheel in $dir/dist"; exit 1; fi
            if ! ls $dir/dist/*.tar.gz 1>/dev/null 2>&1; then echo "Build failed: no sdist in $dir/dist"; exit 1; fi
          done
          echo "Build artifacts OK"

      - name: Publish to PyPI (aport-agent-guardrails, aport-agent-guardrails-langchain, aport-agent-guardrails-crewai)
        run: |
          python -m twine upload --skip-existing python/aport_guardrails/dist/*
          python -m twine upload --skip-existing python/langchain_adapter/dist/*
          python -m twine upload --skip-existing python/crewai_adapter/dist/*

      # Simple index can lag briefly after twine upload succeeds; retry before failing CI.
      - name: Verify PyPI publication
        run: |
          set -uo pipefail
          export VERSION="${{ steps.version.outputs.VERSION }}"
          MAX_ATTEMPTS="4"
          SLEEP_SECONDS="25"

          verify_py() {
            local pkg
            for pkg in aport-agent-guardrails aport-agent-guardrails-langchain aport-agent-guardrails-crewai; do
              PKG="$pkg" VERSION="$VERSION" python -c "import json, os, urllib.request as u, sys; v=os.environ['VERSION']; p=os.environ['PKG']; d=json.loads(u.urlopen('https://pypi.org/pypi/'+p+'/json').read().decode()); sys.exit(0 if v in d.get('releases',{}) else 1)"
            done
          }

          for attempt in $(seq 1 "${MAX_ATTEMPTS}"); do
            echo "PyPI verify (${attempt}/${MAX_ATTEMPTS})..."
            set +e
            verify_py
            rc=$?
            set -e
            if [[ "$rc" -eq 0 ]]; then
              echo "PyPI publication OK"
              exit 0
            fi
            if [[ "$attempt" -lt "${MAX_ATTEMPTS}" ]]; then
              echo "index not listing version yet; waiting ${SLEEP_SECONDS}s..."
              sleep "${SLEEP_SECONDS}"
            fi
          done
          echo "::error::PyPI verification failed after ${MAX_ATTEMPTS} attempts (${SLEEP_SECONDS}s between retries)"
          exit 1

  create-release:
    needs: [publish-npm, publish-python]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve version
        id: version
        run: |
          if [[ "${GITHUB_REF:-}" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF#refs/tags/v}"
          else
            VERSION="${{ github.event.inputs.version }}"
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Bundle enterprise device scripts
        run: |
          set -euo pipefail
          chmod +x scripts/bundle-enterprise-scripts.sh
          APORT_BUNDLE_VERSION="${{ steps.version.outputs.VERSION }}" ./scripts/bundle-enterprise-scripts.sh

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          VERSION="${{ steps.version.outputs.VERSION }}"
          TAG="v${VERSION}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "GitHub release ${TAG} already exists; uploading enterprise assets with --clobber"
            gh release upload "$TAG" --clobber \
              dist/enterprise-scripts/aport-device-deploy.bundled.sh \
              dist/enterprise-scripts/aport-device-enforce.bundled.sh \
              dist/enterprise-scripts/aport-device-uninstall.bundled.sh \
              dist/enterprise-scripts/aport-device-deploy.bundled.ps1 \
              dist/enterprise-scripts/aport-device-enforce.bundled.ps1 \
              dist/enterprise-scripts/aport-device-uninstall.bundled.ps1 \
              dist/enterprise-scripts/aport-device-core.mjs \
              dist/enterprise-scripts/aport-device-deploy.ps1 \
              dist/enterprise-scripts/aport-device-enforce.ps1 \
              dist/enterprise-scripts/aport-device-uninstall.ps1 \
              dist/enterprise-scripts/enterprise-scripts-manifest.json
            exit 0
          fi
          gh release create "$TAG" --generate-notes \
            dist/enterprise-scripts/aport-device-deploy.bundled.sh \
            dist/enterprise-scripts/aport-device-enforce.bundled.sh \
            dist/enterprise-scripts/aport-device-uninstall.bundled.sh \
            dist/enterprise-scripts/aport-device-deploy.bundled.ps1 \
            dist/enterprise-scripts/aport-device-enforce.bundled.ps1 \
            dist/enterprise-scripts/aport-device-uninstall.bundled.ps1 \
            dist/enterprise-scripts/aport-device-core.mjs \
            dist/enterprise-scripts/aport-device-deploy.ps1 \
            dist/enterprise-scripts/aport-device-enforce.ps1 \
            dist/enterprise-scripts/aport-device-uninstall.ps1 \
            dist/enterprise-scripts/enterprise-scripts-manifest.json \
            --notes "## $TAG

          ### Node (npm)
          CLI and core:
          \`\`\`bash
          npm install @aporthq/aport-agent-guardrails@$VERSION
          \`\`\`
          Framework adapters (same version):
          \`\`\`bash
          npm install @aporthq/aport-agent-guardrails-core@$VERSION
          npm install @aporthq/aport-agent-guardrails-langchain@$VERSION
          npm install @aporthq/aport-agent-guardrails-crewai@$VERSION
          npm install @aporthq/aport-agent-guardrails-cursor@$VERSION
          npm install @aporthq/aport-agent-guardrails-claude-code@$VERSION
          npm install @aporthq/openclaw-aport@$VERSION
          \`\`\`
          OpenClaw plugin: \`openclaw plugins install @aporthq/openclaw-aport\`
          (n8n package not published yet — coming soon.)

          ### Python (PyPI)
          \`\`\`bash
          pip install aport-agent-guardrails==$VERSION
          pip install aport-agent-guardrails-langchain==$VERSION
          pip install aport-agent-guardrails-crewai==$VERSION
          \`\`\`

          ### Enterprise device scripts (macOS, Linux, Windows)
          Generic IT install — same version as npm \`v$VERSION\`. Requires Node.js 18+, npm/npx, curl.
          - \`aport-device-deploy.bundled.sh\` / \`.bundled.ps1\` — initial install
          - \`aport-device-enforce.bundled.sh\` / \`.bundled.ps1\` — verify and repair
          - \`aport-device-uninstall.bundled.sh\` / \`.bundled.ps1\` — removal
          - \`aport-device-core.mjs\` — shared cross-platform core
          - \`enterprise-scripts-manifest.json\` — SHA-256 checksums

          Auditable install (download, verify hash, run):
          \`\`\`bash
          curl -fsSL https://api.aport.io/enterprise/scripts/deploy?version=$VERSION -o /tmp/aport-deploy.sh
          # Compare sha256 with GET https://api.aport.io/enterprise/scripts?version=$VERSION
          bash /tmp/aport-deploy.sh   # macOS / Linux
          \`\`\`
          Windows: \`powershell -File aport-device-deploy.bundled.ps1\` with \`APORT_API_KEY\` / \`APORT_TEMPLATE_ID\` set.

          See [README](https://github.com/aporthq/aport-agent-guardrails#readme) and [enterprise-scripts/README.md](https://github.com/aporthq/aport-agent-guardrails/tree/main/enterprise-scripts) for usage."
        if: success()
