# E2E: Install aport-agent-guardrails + aport-agent-guardrails-langchain, run aport-langchain setup --ci, run example and expect ALLOW.
name: E2E LangChain

on:
  push:
    branches: [main, staging]
  pull_request:
    branches: [main, staging]
  workflow_dispatch:

jobs:
  e2e-langchain:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install core and langchain adapter (editable)
        run: |
          python -m pip install --upgrade pip
          pip install --disable-pip-version-check --no-input -e python/aport_guardrails -e "python/langchain_adapter[dev]"
          python -m pip check

      - name: aport-langchain --ci (setup)
        run: |
          aport-langchain --ci
          test -f ~/.aport/langchain/config.yaml && echo "✅ config written"

      - name: Run example (ALLOW then DENY)
        run: |
          cd "$GITHUB_WORKSPACE"
          out=$(PYTHONPATH=python:python/langchain_adapter python3 examples/langchain/run_with_guardrail.py 2>&1) || {
            echo "Script failed with exit code $?"
            echo "Output:"
            echo "$out"
            exit 1
          }
          echo "$out"
          echo "$out" | grep -q "Example: ALLOW and DENY paths OK" || {
            echo "FAIL: expected ALLOW/DENY success message"
            echo "Got:"
            echo "$out"
            exit 1
          }
          echo "✅ E2E: example script ALLOW/DENY OK"

      - name: Run pytest (langchain adapter)
        run: |
          cd python/langchain_adapter
          pytest tests/ -v --tb=short
        env:
          PYTHONPATH: "$GITHUB_WORKSPACE/python"

      - name: Run pytest (core frameworks/langchain)
        run: |
          cd python/aport_guardrails
          pip install --disable-pip-version-check --no-input pytest pytest-asyncio -q
          python -m pip check
          pytest tests/ -v --tb=short
