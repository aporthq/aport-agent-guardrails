name: APort Repository Guard

on:
  pull_request:
    branches: ["main", "staging"]
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
      - labeled
      - unlabeled
      - review_requested
      - review_request_removed
  pull_request_review:
    types: [submitted, dismissed]
  push:
    branches: ["main", "staging"]
  merge_group:

permissions:
  contents: read
  id-token: write
  pull-requests: read

jobs:
  aport:
    name: APort / OAP code.repository.merge.v1
    if: >-
      github.event_name != 'pull_request_review' ||
      github.event.action == 'dismissed' ||
      github.event.review.state != 'commented'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: APort repository guard
        uses: aporthq/policy-verify-action@v1.0.6
        with:
          mode: hosted
          block-protected-paths: true
          protected-paths: >-
            .github/workflows/**,
            .aport/**,
            bin/**,
            enterprise-scripts/**,
            extensions/**,
            external/**,
            packages/**,
            policies/**,
            python/**,
            scripts/**,
            package.json,
            package-lock.json
