name: APort Repository Guard

on:
  pull_request:
    branches: ["main", "staging"]
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
      - labeled
      - unlabeled
      - review_requested
      - review_request_removed
  pull_request_review:
    types: [submitted, dismissed]
  push:
    branches: ["main", "staging"]
  merge_group:

permissions:
  contents: read
  id-token: write
  pull-requests: read

# Superseded pull request runs are cancelled. Push and merge-queue runs are
# never cancelled so every landed commit keeps its audit record.
concurrency:
  group: aport-guard-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  aport:
    name: APort / OAP code.repository.merge.v1
    if: >-
      github.event_name != 'pull_request_review' ||
      github.event.action == 'dismissed' ||
      github.event.review.state != 'commented'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Detect first-time APort guard install
        id: bootstrap
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          BASE_REF: ${{ github.event.pull_request.base.ref }}
        run: |
          set -euo pipefail
          status="$(
            curl -sS -o /dev/null -w "%{http_code}" \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/contents/.github/workflows/aport-repository-guard.yml?ref=${BASE_REF}"
          )"
          if [ "$status" = "404" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "APort Repository Guard is being bootstrapped; enforcement starts after this workflow exists on the base branch."
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Check control-plane override
        id: override
        if: github.event_name == 'pull_request' || github.event_name == 'pull_request_review'
        env:
          LABELS_JSON: ${{ toJson(github.event.pull_request.labels) }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const labels = JSON.parse(process.env.LABELS_JSON || '[]')
            .map((label) => typeof label === 'string' ? label : label?.name)
            .filter(Boolean);
          const headSha = process.env.PR_HEAD_SHA || '';
          const expected = `aport-control-plane-approved-${headSha.slice(0, 12)}`;
          const approved = Boolean(headSha) && labels.includes(expected);
          if (labels.includes('aport-control-plane-approved') && !approved) {
            console.log(`::warning::Legacy control-plane override label is ignored. Apply ${expected} after reviewing this exact head commit.`);
          }
          if (approved) {
            console.log(`Control-plane override is bound to ${headSha}.`);
          }
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `approved=${approved}\n`);
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `expected_label=${expected}\n`);
          NODE

      - name: APort repository guard
        id: aport_guard
        if: steps.bootstrap.outputs.skip != 'true'
        continue-on-error: true
        # Pinned to the v1.0.11 release commit. Bump the SHA and the comment together.
        uses: aporthq/policy-verify-action@433d32239fa46c483bc5936d9bae8c5163d85c03 # v1.0.11
        with:
          # Bound to the repository variable APORT_PROTECT_DEFAULT_BRANCH. The pinned v1.0.11 Action ignores this input
          # (GitHub logs an unknown-input warning). It takes effect once the pin is bumped to 1.1.0 or newer; see the
          # Enforce step below for the condition to switch on at the same time.
          protect-default-branch: ${{ vars.APORT_PROTECT_DEFAULT_BRANCH == 'true' }}
          mode: hosted
          agent-id: ${{ vars.APORT_GITHUB_AGENT_ID }}
          api-key: ${{ secrets.APORT_API_KEY }}
          block-protected-paths: true
          protected-paths: >-
            .github/workflows/**,
            .aport/**

      # Push events are post-commit detection at this pin: the v1.0.11 Action cannot classify a push, so a failure
      # on push is recorded as a warning below and never fails the run. When the pin is bumped to a release that
      # honours protect-default-branch (1.1.0+), replace the event condition with
      #   (github.event_name != 'push' || vars.APORT_PROTECT_DEFAULT_BRANCH == 'true') &&
      # so a protected push fails the run only when the variable opts in.
      - name: Enforce APort repository guard
        if: >-
          ${{
            steps.bootstrap.outputs.skip != 'true' &&
            github.event_name != 'push' &&
            steps.aport_guard.outcome == 'failure' &&
            steps.override.outputs.approved != 'true'
          }}
        run: |
          echo "::error::APort Repository Guard failed. Review the APort action output above."
          exit 1

      - name: Record push audit warning
        if: >-
          ${{
            always() &&
            steps.bootstrap.outputs.skip != 'true' &&
            github.event_name == 'push' &&
            steps.aport_guard.outcome == 'failure'
          }}
        run: |
          echo "::warning::APort Repository Guard push audit reported findings. Push events are post-commit detection; review the APort action output above."

      - name: Record control-plane override
        if: >-
          ${{
            steps.aport_guard.outcome == 'failure' &&
            steps.override.outputs.approved == 'true'
          }}
        env:
          APPROVED_LABEL: ${{ steps.override.outputs.expected_label }}
        run: |
          echo "::warning::APort Repository Guard was manually overridden with ${APPROVED_LABEL}. Use this only after maintainer review of guard workflow or policy changes for this exact commit."
