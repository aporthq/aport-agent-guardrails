name: Secrets Scan

on:
  push:
    branches: ["main", "dev"]
  pull_request:
    branches: ["main", "dev"]
  schedule:
    # Run weekly on Mondays at 00:00 UTC
    - cron: '0 0 * * 1'
  workflow_dispatch:

permissions:
  contents: read
  security-events: write
  pull-requests: write  # For PR comments

jobs:
  gitleaks:
    name: Scan for secrets with Gitleaks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Full history for comprehensive scan
          persist-credentials: false

      - name: Identify checked-out integrity target
        id: integrity-revision
        shell: bash
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Check Git integrity before repository execution
        uses: aporthq/policy-verify-action/integrity@d1ccc3aa355c449018ee1adef5a59b3b79c92fb2
        with:
          head: ${{ steps.integrity-revision.outputs.sha }}

      - name: Install Gitleaks
        id: scanner
        shell: bash
        env:
          SCANNER_NAME: gitleaks
          SCANNER_URL: https://github.com/gitleaks/gitleaks/releases/download/v8.18.2/gitleaks_8.18.2_linux_x64.tar.gz
          # Source: https://github.com/gitleaks/gitleaks/releases/download/v8.18.2/gitleaks_8.18.2_checksums.txt
          SCANNER_SHA256: 6298c9235dfc9278c14b28afd9b7fa4e6f4a289cb1974bd27949fc1e9122bdee
          SCANNER_VERSION_ARG: version
        run: &install-scanner |
          set -euo pipefail
          # Never download, extract or resolve executables in candidate-controlled paths.
          tool_dir="$(mktemp -d "${RUNNER_TEMP:?}/secrets-scan.XXXXXX")"
          cd "$tool_dir"
          archive="$tool_dir/scanner.tar.gz"
          curl --fail --silent --show-error --location --output "$archive" "$SCANNER_URL"
          printf '%s  %s\n' "$SCANNER_SHA256" "$archive" | sha256sum -c -
          tar -xzf "$archive" -C "$tool_dir" "$SCANNER_NAME"
          scanner="$tool_dir/$SCANNER_NAME"
          if [[ ! -f "$scanner" || -L "$scanner" || ! -x "$scanner" ]]; then
            echo "::error::Scanner must be a regular executable, not a symlink"
            exit 1
          fi
          "$scanner" "$SCANNER_VERSION_ARG"
          printf 'binary=%s\n' "$scanner" >> "$GITHUB_OUTPUT"

      - name: Run Gitleaks
        id: scan
        shell: bash
        env:
          SCANNER_BIN: ${{ steps.scanner.outputs.binary }}
        run: |
          set -euo pipefail
          # Unlink candidate reports (including symlinks) before the scanner writes.
          rm -f -- gitleaks-report.json
          "$SCANNER_BIN" detect --source . --report-path gitleaks-report.json --report-format json --verbose || true
          [[ ! -L gitleaks-report.json && ( ! -e gitleaks-report.json || -f gitleaks-report.json ) ]]

      - name: Upload Gitleaks report
        if: always() && steps.scan.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: gitleaks-report
          path: gitleaks-report.json
          retention-days: 30

      - name: Check for secrets
        id: check_secrets
        run: |
          if [ ! -L gitleaks-report.json ] && [ -f gitleaks-report.json ] && [ -s gitleaks-report.json ] && [ "$(jq '. | length' gitleaks-report.json)" -gt 0 ]; then
            echo "secrets_found=true" >> "$GITHUB_OUTPUT"
            echo "⚠️ Secrets detected!"
            jq -r '.[] | "- \(.Description) in \(.File):\(.StartLine)"' gitleaks-report.json | head -20
          else
            echo "secrets_found=false" >> "$GITHUB_OUTPUT"
            echo "✅ No secrets detected"
          fi

      - name: Comment on PR (if secrets found)
        if: steps.check_secrets.outputs.secrets_found == 'true' && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: '⚠️ **Secrets detected by Gitleaks!**\n\nPlease review the Gitleaks report and remove any secrets before merging.\n\nSee the workflow run for details: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}'
            })

  trufflehog:
    name: Scan for secrets with TruffleHog
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Full history for comprehensive scan
          persist-credentials: false

      - name: Identify checked-out integrity target
        id: integrity-revision
        shell: bash
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Check Git integrity before repository execution
        uses: aporthq/policy-verify-action/integrity@d1ccc3aa355c449018ee1adef5a59b3b79c92fb2
        with:
          head: ${{ steps.integrity-revision.outputs.sha }}

      - name: Install TruffleHog
        id: scanner
        shell: bash
        env:
          SCANNER_NAME: trufflehog
          SCANNER_URL: https://github.com/trufflesecurity/trufflehog/releases/download/v3.63.5/trufflehog_3.63.5_linux_amd64.tar.gz
          # Source: https://github.com/trufflesecurity/trufflehog/releases/download/v3.63.5/trufflehog_3.63.5_checksums.txt
          SCANNER_SHA256: 7ff2575d3d185b5d0a035e91b5215588f72ae2dc7c0d2e6badf2f2d09a65ef74
          SCANNER_VERSION_ARG: --version
        run: *install-scanner

      - name: Run TruffleHog
        id: scan
        shell: bash
        env:
          SCANNER_BIN: ${{ steps.scanner.outputs.binary }}
        run: |
          set -euo pipefail
          rm -f -- trufflehog-report.json
          "$SCANNER_BIN" filesystem . --json --only-verified > trufflehog-report.json || true
          [[ ! -L trufflehog-report.json && ( ! -e trufflehog-report.json || -f trufflehog-report.json ) ]]

      - name: Upload TruffleHog report
        if: always() && steps.scan.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: trufflehog-report
          path: trufflehog-report.json
          retention-days: 30

      - name: Check for verified secrets
        run: |
          if [ ! -L trufflehog-report.json ] && [ -f trufflehog-report.json ] && [ -s trufflehog-report.json ]; then
            echo "⚠️ Verified secrets may have been detected"
            echo "Review the uploaded artifact for details"
          else
            echo "✅ No verified secrets detected"
          fi
