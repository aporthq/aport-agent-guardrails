name: Repository integrity
on:
  push:
    branches: ['**']
    tags: ['**']
  pull_request:
  merge_group:
  schedule:
    - cron: '37 7 * * *'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  integrity:
    name: Repository integrity
    if: github.event.deleted != true
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Identify checked-out integrity target
        id: integrity-revision
        shell: bash
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Check Git integrity before repository execution
        uses: aporthq/policy-verify-action/integrity@9e41e4d832521828f86f5ce2d2c7027bb44c3471
        with:
          head: ${{ steps.integrity-revision.outputs.sha }}
