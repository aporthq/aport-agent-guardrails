name: CI

on:
  push:
    branches: [main, staging]
  pull_request:
    branches: [main, staging]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      # Actions are pinned to release commits. Bump each SHA and its comment together.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          submodules: recursive
          fetch-depth: 0
          persist-credentials: false
      - name: Identify checked-out integrity target
        id: integrity-revision
        shell: bash
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Check Git integrity before repository execution
        uses: aporthq/policy-verify-action/integrity@d1ccc3aa355c449018ee1adef5a59b3b79c92fb2
        with:
          head: ${{ steps.integrity-revision.outputs.sha }}

      - name: Install dependencies
        run: |
          set -euo pipefail
          sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=20 update
          sudo apt-get install -y --no-install-recommends curl jq uuid-runtime

      - name: Make scripts executable
        run: |
          chmod +x bin/*.sh bin/lib/*.sh enterprise-scripts/*.sh enterprise-scripts/*.mjs scripts/*.sh tests/*.sh tests/unit/*.sh tests/frameworks/openclaw/setup.sh 2>/dev/null || true

      # Provision every runtime and dependency before the first collected test.
      # `make test` builds the TypeScript workspaces and drives the Python
      # evaluator, so Node and Python prerequisites must already be installed.
      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
          cache: "npm"

      - name: Install Node dependencies
        run: npm ci

      - name: Verify npm dependency signatures
        run: npm audit signatures

      - name: Setup Python
        # Pinned to the v5.6.0 release commit. Bump the SHA and the comment together.
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"

      - name: Install Python test prerequisites
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          pip install --disable-pip-version-check --no-input build -e "python/aport_guardrails[dev]" -e "python/langchain_adapter[dev]"
          python -m pip check

      - name: Validate passport schema
        run: |
          # Validate OAP v1 template from spec submodule is valid JSON
          jq . external/aport-spec/oap/examples/passport.template.v1.json > /dev/null
          echo "✅ Passport template is valid JSON"

      - name: Test guardrail script
        run: |
          # Test with valid context
          bin/aport-guardrail.sh git.create_pr '{"repo":"test","files_changed":5}' || echo "Test completed"

      - name: Run tests
        run: make test
        env:
          APORT_SKIP_REMOTE_PASSPORT_TEST: "1"

      - name: Run Python unit tests
        run: PYTHONPATH=python:python/langchain_adapter python -m pytest python/aport_guardrails/tests python/langchain_adapter/tests -q

      - name: Enterprise MDM script bundle check
        run: |
          set -euo pipefail
          chmod +x scripts/bundle-enterprise-scripts.sh
          bash tests/unit/test-enterprise-device-scripts.sh

      - name: Verify Codex provider tool surface
        run: bash scripts/check-codex-provider-tool-surface.sh

      - name: Build and test Node packages
        run: |
          npm run build
          npm run test -w @aporthq/aport-agent-guardrails-core -w @aporthq/aport-agent-guardrails-langchain

      - name: Run OpenClaw integration (Node)
        run: node tests/frameworks/openclaw/setup.test.mjs

      - name: Run plugin tests
        run: |
          cd extensions/openclaw-aport && npm test
